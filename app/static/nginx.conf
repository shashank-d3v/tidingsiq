worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;
    access_log /dev/stdout;
    log_format engagement escape=json '{"event_schema":"tidingsiq-engagement-v1","time":"$time_iso8601","page_id":"$event_page","event":"$event_name","view":"$event_view","days":"$event_days","status":$status}';
    server_tokens off;
    sendfile off;
    keepalive_timeout 5;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 512;
    map $uri $cache_policy {
        default "no-cache";
        ~^/data/feed-(7|30)d-[a-f0-9]+\.json$ "public, max-age=31536000, immutable";
        /data/manifest.json "public, max-age=60, must-revalidate";
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        autoindex off;
        add_header Cache-Control $cache_policy always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        location = / { try_files /index.html =404; }
        location = /healthz { access_log off; return 200 "ok\n"; }
        location ^~ /_stcore/ {
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options nosniff always;
            return 410;
        }
        location ~ "^/events/v1/(?<event_page>[a-f0-9]{32})/(?<event_name>page_view|engaged|article_click|view_change|range_change)/(?<event_view>brief|pulse|methodology)/(?<event_days>1|3|7|30)$" {
            if ($request_method != GET) { return 405; }
            if ($args != "") { return 400; }
            access_log /dev/stdout engagement;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            return 204;
        }
        location ~ ^/(index\.html|styles\.css|app\.mjs|feed\.mjs|analytics\.mjs|favicon\.png)$ { try_files $uri =404; }
        location = /data/manifest.json { try_files $uri =404; }
        location ~ ^/data/feed-(7|30)d-[a-f0-9]+\.json$ {
            gzip_static on;
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
